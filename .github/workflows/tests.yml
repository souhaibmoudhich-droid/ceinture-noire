name: Tests agenda
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".github/workflows/**"]
  pull_request:
    paths: ["scripts/**", "tests/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt pytest
      - run: python -m pytest -q tests
